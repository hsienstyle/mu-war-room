name: Daily 2059.TW (川湖) 16:30 Chips Report & LINE Push

on:
  schedule:
    # 第一梯次（防漏保險）：台灣時間週一至週五 16:40 (UTC 08:40)
    - cron: '40 8 * * 1-5'
    # 第二梯次（防漏保險）：台灣時間週一至週五 17:05 (UTC 09:05)
    - cron: '5 9 * * 1-5'
  workflow_dispatch:
    inputs:
      force_latest:
        description: '若今日休市，是否強制回溯最近交易日發送測試報告'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  run-tw2059-chips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 2059.TW Post-Market Chips Report & LINE Push
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${{ github.event.inputs.force_latest }}" = "true" ]; then
            python cloud_tw2059_chips.py --force-latest
          else
            python cloud_tw2059_chips.py
          fi

      - name: Commit and Push updated 2059.TW chips data to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html tw2059_chips.json last_tw2059_run_date.txt
          if git diff --staged --quiet; then
            echo "No 2059.TW chips changes to commit."
          else
            git commit -m "chore(cloud): Auto-update 2059.TW 16:30 post-market chips report"
            git push origin main
          fi
